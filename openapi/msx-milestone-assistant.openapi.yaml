openapi: 3.0.3
info:
  title: MSX Milestone Assistant API (Mock)
  version: 0.2.0
  description: >
    REST API for the MSX Milestone Assistant, a SYNTHETIC MOCK application for
    Solution Engineering opportunity and milestone management. NOT connected to
    real MSX, Dataverse, Power Platform, or customer data.

    Data is imported from the Excel workbook (the single source of truth):
    data/MSX_Mirror_Necessary_Tables_Import_10_More_Entries.xlsx.

    Agent governance:
      * Agents may read context and view recommendations/approvals freely.
      * A real milestone may only be created by fulfilling an APPROVED approval
        request (POST /api/agent/approvals/{id}/fulfill). Fulfilling a non-approved
        request returns 403 and is audited as "Denied".
      * Every agent write path is written to the Agent Action Audit Log.
servers:
  - url: http://localhost:4000
    description: Local mock server
tags:
  - name: Health
  - name: Opportunities
  - name: Milestones
  - name: Collaboration
  - name: Agent
  - name: Notifications
  - name: Dashboard
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200': { description: Service is healthy }

  /api/opportunities:
    get:
      tags: [Opportunities]
      summary: List opportunities
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: salesStage, schema: { type: string } }
      responses:
        '200': { description: Array of opportunities }
    post:
      tags: [Opportunities]
      summary: Create an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityInput' }
      responses:
        '201': { description: Created }
        '400': { description: Validation error }
  /api/opportunities/{id}:
    get:
      tags: [Opportunities]
      summary: Get an opportunity with milestones, team, notes and recommendations
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: Opportunity }
        '404': { description: Not found }
    patch:
      tags: [Opportunities]
      summary: Update an opportunity
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: Updated }
    delete:
      tags: [Opportunities]
      summary: Delete an opportunity
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: Deleted }

  /api/milestones:
    get:
      tags: [Milestones]
      summary: List milestones
      parameters:
        - { in: query, name: opportunityId, schema: { type: string } }
        - { in: query, name: milestoneStatus, schema: { type: string } }
      responses:
        '200': { description: Array of milestones }
    post:
      tags: [Milestones]
      summary: Create a milestone (connect to an opportunity by name)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneInput' }
      responses:
        '201': { description: Created }
  /api/milestones/{id}:
    get:
      tags: [Milestones]
      summary: Get a milestone with history, recommendations, approvals and notes
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: Milestone }
        '404': { description: Not found }
    patch:
      tags: [Milestones]
      summary: Update a milestone
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: Updated }
    delete:
      tags: [Milestones]
      summary: Delete a milestone
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: Deleted }
  /api/milestones/{id}/status:
    post:
      tags: [Milestones]
      summary: Change milestone status (writes Milestone Status History)
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStatus, changedBy]
              properties:
                newStatus: { type: string }
                changedBy: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Updated }

  /api/collaboration/notes:
    get:
      tags: [Collaboration]
      summary: List collaboration notes
      responses:
        '200': { description: Notes }
    post:
      tags: [Collaboration]
      summary: Add a collaboration note
      responses:
        '201': { description: Created }
  /api/collaboration/deal-team:
    get:
      tags: [Collaboration]
      summary: List deal team members for an opportunity
      parameters:
        - { in: query, name: opportunityId, required: true, schema: { type: string } }
      responses:
        '200': { description: Members }
    post:
      tags: [Collaboration]
      summary: Add a deal team member
      responses:
        '201': { description: Created }

  /api/agent/context/{opportunityId}:
    get:
      tags: [Agent]
      summary: Read opportunity context for an agent (audited as Read)
      parameters:
        - { in: path, name: opportunityId, required: true, schema: { type: string } }
        - { in: query, name: agentName, schema: { type: string } }
      responses:
        '200': { description: Opportunity context }
  /api/agent/recommendations:
    get:
      tags: [Agent]
      summary: List AI milestone recommendations
      parameters:
        - { in: query, name: reviewStatus, schema: { type: string } }
        - { in: query, name: opportunityId, schema: { type: string } }
      responses:
        '200': { description: Recommendations }
  /api/agent/approvals:
    get:
      tags: [Agent]
      summary: List approval requests
      parameters:
        - { in: query, name: approvalStatus, schema: { type: string } }
      responses:
        '200': { description: Approvals }
  /api/agent/approvals/{id}/decision:
    post:
      tags: [Agent]
      summary: Human decision (approve/reject) on an approval request
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reviewedBy]
              properties:
                decision: { type: string, enum: [Approved, Rejected] }
                reviewedBy: { type: string }
                decisionNotes: { type: string }
      responses:
        '200': { description: Decided }
        '409': { description: Already decided }
  /api/agent/approvals/{id}/fulfill:
    post:
      tags: [Agent]
      summary: >
        Create the real milestone from an APPROVED approval request (using its
        related recommendation). Blocked (403) and audited as "Denied" if not Approved.
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agentName: { type: string }
      responses:
        '201': { description: Milestone created }
        '403': { description: Blocked — approval not granted }
  /api/agent/runs:
    get:
      tags: [Agent]
      summary: List agent runs (from the workbook)
      responses:
        '200': { description: Runs }
  /api/agent/audit:
    get:
      tags: [Agent]
      summary: Read the agent action audit log
      parameters:
        - { in: query, name: agentName, schema: { type: string } }
      responses:
        '200': { description: Audit log entries }

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List agent notifications
      parameters:
        - { in: query, name: notifyRole, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: Notifications }
  /api/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: Updated }

  /api/dashboard/metrics:
    get:
      tags: [Dashboard]
      summary: Live dashboard metrics (computed from imported data)
      responses:
        '200': { description: Metrics }
  /api/dashboard/snapshots:
    get:
      tags: [Dashboard]
      summary: List Dashboard Metric Snapshot rows from the workbook
      responses:
        '200': { description: Snapshots }

components:
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    OpportunityInput:
      type: object
      required: [opportunityBusinessId, opportunityName]
      properties:
        opportunityBusinessId: { type: string, example: OPP-016 }
        opportunityName: { type: string }
        tpid: { type: string }
        customerName: { type: string }
        industry: { type: string }
        solutionArea: { type: string, example: Modern Work }
        salesStage: { type: string, example: Listen & Consult }
        status: { type: string, example: Active }
        estimatedRevenue: { type: number }
        closeDate: { type: string, format: date }
        aeOwner: { type: string }
        assignedSE: { type: string }
        competitorName: { type: string }
        consumptionPhase: { type: string }
        businessProblem: { type: string }
        nextStep: { type: string }
    MilestoneInput:
      type: object
      required: [milestoneBusinessId, milestoneName, opportunityName]
      properties:
        milestoneBusinessId: { type: string, example: MS-016 }
        milestoneName: { type: string }
        opportunityName: { type: string, description: Lookup target — connects to Opportunity.opportunityName }
        workload: { type: string }
        milestoneCategory: { type: string }
        milestoneStatus: { type: string, example: On Track }
        partnerName: { type: string }
        estDate: { type: string, format: date }
        fitCharge: { type: number }
        riskDescription: { type: string }
        riskImpact: { type: string, example: Medium }
        mitigationPlan: { type: string }
        blockedReason: { type: string }
        owner: { type: string }
