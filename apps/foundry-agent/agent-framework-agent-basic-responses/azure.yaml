# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: agent-framework-agent-basic-responses
services:
    agent-framework-agent-basic-responses:
        project: src/agent-framework-agent-basic-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Multi-Agent Sales Assistant orchestrator that delegates to milestone, dashboard, and opportunity specialists (mock data).
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: API_BASE_URL
              value: ${MSX_API_BASE_URL}
            - name: API_KEY
              value: ${MSX_API_KEY}
            - name: AAD_TENANT_ID
              value: ${AAD_TENANT_ID}
            - name: AGENT_APP_CLIENT_ID
              value: ${AGENT_APP_CLIENT_ID}
            - name: MSX_API_SCOPE
              value: ${MSX_API_SCOPE}
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: agent-framework-agent-basic-responses
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
infra:
    provider: microsoft.foundry
